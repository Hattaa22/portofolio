name: Build and Deploy PHP site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8000 index.php >/dev/null 2>&1 &
          sleep 3

      - name: Crawl site to static HTML
        run: |
          mkdir -p ./out
          curl -s http://127.0.0.1:8000/ -o ./out/index.html
          cp -r assets ./out/assets || true
          touch ./out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true

