name: Build and Deploy PHP site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8000 index.php >/dev/null 2>&1 &
          sleep 2

      - name: Crawl site to static HTML with wget
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          mkdir -p ./out
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent -e robots=off http://127.0.0.1:8000/ -P ./out
          if [ -d ./out/127.0.0.1:8000 ]; then
            shopt -s dotglob || true
            cp -r ./out/127.0.0.1:8000/* ./out/ || true
            rm -rf ./out/127.0.0.1:8000 || true
          fi
          touch ./out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true

